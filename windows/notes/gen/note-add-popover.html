<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add note popover</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../../index.css">
  <style></style>
</head>

<body>
  <div class="demo">
    <div class="note-popover" role="dialog" aria-labelledby="note-add-title" data-mode="create">
      <span class="note-popover__caret" aria-hidden="true"></span>

      <header class="note-popover__header">
        <span class="note-popover__title" id="note-add-title">New note</span>
        <button class="note-icon-btn" aria-label="Close" data-action="close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </header>
      <div class="note-type-picker">
        <label for="note-type-select">Type</label>
        <select name="note-type-select" class="notes-filter" id="note-type-select">
          <option value="ScriptNotes" selected="selected">Script Note</option>
          <option value="Comments">Comment</option>
          <option value="Beats">Beat</option>
          <option value="StructurePoints">Structure Point</option>
          <option value="Bookmarks">Bookmark</option>
          <option value="Sfx">SFX</option>
          <option value="Vfx">VFX</option>
          <option value="Props">Prop</option>
        </select>
      </div>
      <!-- <fieldset class="note-type-picker">
      <legend>Type</legend>
      <label><input type="radio" name="note-type" value="comment" checked><span class="note-chip">Comment</span></label>
      <label><input type="radio" name="note-type" value="suggestion"><span class="note-chip">Suggestion</span></label>
      <label><input type="radio" name="note-type" value="task"><span class="note-chip">Task</span></label>
     </fieldset> -->

      <!-- <div class="note-section-label">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>
     Fixed
     </div> -->
      <table class="note-fields note-fields--fixed">

          <tr>
            <th scope="row">Page</th>
            <td data-bind="page">Page 12</td>
          </tr>
        <!-- <tr><th scope="row">Author</th><td data-bind="author">Alex Rivera</td></tr> -->
      </table>

      <!-- <div class="note-section-label">Details</div> -->
      <!-- <table class="note-fields note-fields--editable"> -->
      <!-- <tr>
      <th scope="row">Status</th>
      <td>
        <button class="note-field note-field--select" aria-haspopup="listbox" data-field="status">
          <span class="note-status" data-status="open">Open</span>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#6B685F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
      </td>
     </tr>
      <tr><th scope="row"><label for="add-owner">Owner</label></th><td><input class="note-field" id="add-owner" data-field="owner" placeholder="Add owner"></td></tr>
      <tr><th scope="row"><label for="add-due">Due</label></th><td><input class="note-field" id="add-due" data-field="due" placeholder="Add date"></td></tr> -->
      <!-- </table> -->

      <div class="note-body">
        <label class="note-body__label" for="add-body">Note</label>
        <textarea class="note-body__input" id="add-body" data-field="body" placeholder="Write a note…"
          autofocus></textarea>
      </div>

      <footer class="note-popover__footer">
        <span></span>
        <div class="note-popover__actions">
          <button class="note-btn" data-action="cancel">Cancel</button>
          <button class="note-btn note-btn--primary" data-action="add">Add note</button>
        </div>
      </footer>
    </div>
  </div>
</body>

</html>
