<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note popover</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="notes.css">
  <style>

  </style>
</head>

<body>
    <div class="note-popover" role="dialog" aria-labelledby="note-popover-title" data-note-id="note-12">
      <span class="note-popover__caret" aria-hidden="true"></span>

      <header class="note-popover__header">
        <!-- <span class="note-chip" data-type="comment" data-bind="type">Comment</span> -->
        <span class="note-popover__title" id="note-popover-title">Note</span>
        <button class="note-icon-btn" aria-label="More actions" data-action="more">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <circle cx="3" cy="8" r="1.4" />
            <circle cx="8" cy="8" r="1.4" />
            <circle cx="13" cy="8" r="1.4" />
          </svg>
        </button>
        <button class="note-icon-btn" aria-label="Close" data-action="close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </header>

      <!-- Immutable fields: render as text, never as inputs -->
      <!-- <div class="note-section-label">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="7" width="10" height="7" rx="1.5" />
          <path d="M5.5 7V5a2.5 2.5 0 015 0v2" />
        </svg>
        Fixed
      </div> -->
      <table class="note-fields note-fields--fixed">
        <tr>
          <th scope="row">Page</th>
          <td data-bind="page">Page 12</td>
        </tr>
        <tr>
          <th scope="row">Author</th>
          <td data-bind="author">Alex Rivera</td>
        </tr>
        <tr>
          <th scope="row">Created</th>
          <td data-bind="created">Nov 12, 2026, 4:18 PM</td>
        </tr>
      </table>

      <!-- Editable fields: add or remove rows per note type -->
      <!-- <div class="note-section-label">Details</div> -->

              <span class="note-status" data-status="open">Open</span>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#6B685F" stroke-width="1.6"

          </td>

        <tr>
          <th scope="row"><label for="note-owner">Owner</label></th>

        <tr>

          <td><input class="note-field" id="note-due" data-field="due" placeholder="Add date"></td>
        </tr>
      </table> -->

      <div class="note-body">
        <label class="note-body__label" for="note-body">Note</label>
        <textarea class="note-body__input" id="note-body"
          data-field="body">Check this figure against the source before publishing.</textarea>
      </div>

      <footer class="note-popover__footer">
        <button class="note-btn note-btn--danger" data-action="delete">Delete</button>
        <div class="note-popover__actions">
          <button class="note-btn" data-action="cancel">Cancel</button>
          <button class="note-btn note-btn--primary" data-action="save">Save</button>
        </div>
      </footer>
  </div>
</body>

</html>
