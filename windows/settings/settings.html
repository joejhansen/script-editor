<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/index.css" />
    <link rel="stylesheet" type="text/css" href="settings.css" />

    <title>Settings - LibreScript</title>
</head>

<body>
    <nav>
        <button>Formatting</button>
    </nav>
    <main id="settings-content">
        <section id="page-settings">
            <h2>Page</h2>
            <ul class="margins" id="page-margins">
                <li>
                    <label for="page-topMargin">Top Margin</label>
                    <input type="text" name="page-topMargin" id="page-topMargin">
                </li>
                <li>
                    <label for="page-bottomMargin">Bottom Margin</label>
                    <input type="text" name="page-bottomMargin" id="page-bottomMargin">
                </li>
                <li>
                    <label for="page-leftMargin">Left Margin</label>
                    <input type="text" name="page-leftMargin" id="page-leftMargin">
                </li>
                <li>
                    <label for="page-rightMargin">Right Margin</label>
                    <input type="text" name="page-rightMargin" id="page-rightMargin">
                </li>
            </ul>
        </section>
        <section id="element-settings">
            <label for="element-select">
                <h2>Elements</h2>
            </label>
            <select name="elements" id="element-select">
                <option value="sceneHeading">Scene Heading</option>
                <option value="character">Character</option>
                <option value="dialogue">Dialogue</option>
                <option value="parenthetical">Parenthetical</option>
                <option value="transition">Transition</option>
                <option value="shot">Shot</option>
                <option value="sequence">Sequence</option>
                <option value="newAct">New Act</option>
                <option value="endofAct">End of Act</option>
                <option value="castList">Cast List</option>
                <option value="general">General</option>
            </select>
            <h3 id="">Margins</h3>
            <ul class="margins" id="element-margins">
                <li>
                    <label for="element-topMargin">Top Margin</label>
                    <input type="text" name="element-topMargin" id="element-topMargin">
                </li>
                <li>
                    <label for="element-bottomMargin">Bottom Margin</label>
                    <input type="text" name="element-bottomMargin" id="element-bottomMargin">
                </li>
                <li>
                    <label for="element-leftMargin">Left Margin</label>
                    <input type="text" name="element-leftMargin" id="element-leftMargin">
                </li>
                <li><label for="element-rightMargin">Right Margin</label>
                    <input type="text" name="element-rightMargin" id="element-rightMargin">
                </li>
            </ul>
            <h3>Fonts</h3>
            <ul id="fonts">
                <li>
                    <label for="font">Font</label>
                    <select name="font" id="font">
                        <option value="Courier New">Courier New</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times">Times New Roman</option>
                    </select>
                </li>
                <li>
                    <label for="fontSize">Font Size</label>
                    <input type="text" name="fontSize" id="fontSize">
                </li>
            </ul>
            <h3>Indent and Alignment</h3>
            <ul id="indent-alignment">
                <li>
                    <label for="indent">Indent</label>
                    <input type="text" name="indent" id="indent">
                </li>
                <li>
                    <label for="textAlign">Alignment</label>
                    <select name="textAlign" id="textAlign">
                        <option value="left">Left</option>
                        <option value="center">Center</option>
                        <option value="right">Right</option>
                    </select>
                </li>
            </ul>
            <h3>Inline Styles</h3>
            <ul id="styling">
                <li><label for="bold">Bold</label><input type="checkbox" name="bold" id="bold"></li>
                <li><label for="italics">Italics</label><input type="checkbox" name="italics" id="italics"></li>
                <li><label for="underline">Underline</label><input type="checkbox" name="underline" id="underline"></li>
                <li><label for="allCaps">All Caps</label><input type="checkbox" name="allCaps" id="allCaps"></li>
            </ul>
        </section>

    </main>
    <aside id="confirm-bar">
        <ul>
            <li><button>Cancel</button></li>
            <li><button>Save</button></li>
        </ul>
    </aside>
    <script src="settings.js" type="module" defer></script>

</body>

</html>
